name: FitnessTracker
options:
  bundleIdPrefix: com.arshaanbhimani
  deploymentTarget:
    iOS: "17.0"
packages:
  FitnessKit:
    path: ../FitnessKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  FitnessTracker:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Dev convenience: bundle the (gitignored) real export so the simulator
      # seeds itself. Optional — builds fine on machines without it.
      - path: ../data/strong_workouts.csv
        optional: true
        buildPhase: resources
    dependencies:
      - package: FitnessKit
      - package: Supabase
        product: Supabase
    entitlements:
      path: FitnessTracker.entitlements
      properties:
        # Rest-timer notifications break through Focus/DND (the alert is
        # useless delivered silently to Notification Center mid-workout).
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        # Registered CSV handler: Strong's "Export workouts" share sheet can
        # send the file straight to this app (received via onOpenURL).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Strong CSV Export
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.comma-separated-values-text
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.arshaanbhimani.fitnesstracker
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XQ3CA646Q5
