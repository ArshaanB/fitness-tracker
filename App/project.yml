name: FitnessTracker
options:
  bundleIdPrefix: com.arshaanbhimani
  deploymentTarget:
    iOS: "17.0"
packages:
  FitnessKit:
    path: ../FitnessKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
targets:
  FitnessTracker:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      # Dev convenience: bundle the (gitignored) real export so the simulator
      # seeds itself. Optional — builds fine on machines without it.
      - path: ../data/strong_workouts.csv
        optional: true
        buildPhase: resources
    dependencies:
      - package: FitnessKit
      - package: Supabase
        product: Supabase
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.arshaanbhimani.fitnesstracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XQ3CA646Q5
