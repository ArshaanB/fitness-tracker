name: FitnessTracker
options:
  bundleIdPrefix: dev.arshaan
  deploymentTarget:
    iOS: "17.0"
packages:
  FitnessKit:
    path: ../FitnessKit
targets:
  FitnessTracker:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Dev convenience: bundle the (gitignored) real export so the simulator
      # seeds itself. Optional — builds fine on machines without it.
      - path: ../data/strong_workouts.csv
        optional: true
        buildPhase: resources
    dependencies:
      - package: FitnessKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.arshaan.fitnesstracker
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: NO
        # This machine has only the simulator SDK installed; device builds
        # need `xcodebuild -downloadPlatform iOS` first, then this can revert.
        SDKROOT: iphonesimulator
        SUPPORTED_PLATFORMS: iphonesimulator
